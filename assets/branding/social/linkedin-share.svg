<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <radialGradient id="liBg" cx="45%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0a1526"/>
      <stop offset="60%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#010206"/>
    </radialGradient>
    <linearGradient id="liBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077B5"/>
      <stop offset="50%" stop-color="#00F3FF"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>
    <filter id="liGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#liBg)"/>
  <rect x="20" y="20" width="1160" height="587" rx="18" fill="none" stroke="url(#liBorder)" stroke-width="2" opacity="0.6"/>

  <!-- Left: Content -->
  <g transform="translate(70, 70)">
    <rect width="250" height="34" rx="17" fill="#0077b5" fill-opacity="0.15" stroke="#0077B5" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="5" fill="#0077B5"/>
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">OPEN-SOURCE RELEASE</text>

    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      NoCatch <tspan fill="#39FF14">v2.0 Core</tspan>
    </text>
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="600" fill="#00F3FF">
      Universal Google NotebookLM Harvester
    </text>
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#94A3B8" font-weight="400">
      Extract high-quality Audio Overviews (M4A), Video Canvas (MP4),
    </text>
    <text x="0" y="205" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#94A3B8" font-weight="400">
      Markdown notes, and 1-click in-browser client ZIP bundles.
    </text>

    <!-- Key Metrics Grid -->
    <g transform="translate(0, 245)">
      <rect width="160" height="65" rx="12" fill="#06101c" stroke="#1E293B" stroke-width="1"/>
      <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#39FF14">128 kbps</text>
      <text x="20" y="48" font-family="monospace" font-size="11" fill="#64748B">Loss-Free Stereo</text>

      <g transform="translate(175, 0)">
        <rect width="160" height="65" rx="12" fill="#06101c" stroke="#1E293B" stroke-width="1"/>
        <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#00F3FF">0 Servers</text>
        <text x="20" y="48" font-family="monospace" font-size="11" fill="#64748B">Client-Side JSZip</text>
      </g>

      <g transform="translate(350, 0)">
        <rect width="160" height="65" rx="12" fill="#06101c" stroke="#1E293B" stroke-width="1"/>
        <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="#BC13FE">Zero-Trust</text>
        <text x="20" y="48" font-family="monospace" font-size="11" fill="#64748B">100% Private</text>
      </g>
    </g>

    <g transform="translate(0, 345)">
      <rect width="380" height="40" rx="10" fill="#01060f" stroke="#39FF14" stroke-width="1.2"/>
      <circle cx="20" cy="20" r="4.5" fill="#39FF14"/>
      <text x="36" y="25" font-family="monospace" font-size="14" font-weight="700" fill="#FFFFFF">https://nocatch.lorapok.tech</text>
    </g>
  </g>

  <!-- Right: Visual -->
  <g transform="translate(730, 130)">
    <circle cx="200" cy="200" r="180" fill="#0077b5" fill-opacity="0.12" filter="url(#liGlow)"/>
    <ellipse cx="140" cy="240" rx="60" ry="56" fill="#00a8cc"/>
    <ellipse cx="190" cy="230" rx="66" ry="62" fill="#00c9b7"/>
    <ellipse cx="240" cy="220" rx="72" ry="68" fill="#14e396"/>
    <path d="M 130 270 C 180 300, 250 290, 310 240" fill="none" stroke="#39FF14" stroke-width="6" stroke-linecap="round" filter="url(#liGlow)"/>
    <ellipse cx="310" cy="205" rx="80" ry="74" fill="#00F3FF"/>
    <path d="M 220 190 C 230 90, 380 90, 390 190" fill="none" stroke="#39FF14" stroke-width="10" stroke-linecap="round" filter="url(#liGlow)"/>
    <rect x="208" y="170" width="20" height="50" rx="10" fill="#020814" stroke="#0077B5" stroke-width="3"/>
    <rect x="382" y="170" width="20" height="50" rx="10" fill="#020814" stroke="#39FF14" stroke-width="3"/>
    <rect x="265" y="180" width="95" height="54" rx="16" fill="#020814" stroke="#00F3FF" stroke-width="3.5"/>
    <rect x="278" y="195" width="22" height="22" rx="6" fill="#39FF14" filter="url(#liGlow)"/>
    <rect x="325" y="195" width="22" height="22" rx="6" fill="#39FF14" filter="url(#liGlow)"/>
  </g>
</svg>
