<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none" role="img" aria-label="NoCatch by Lorapok Labs - Social Preview">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="50%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#010206"/>
    </linearGradient>

    <radialGradient id="cyanFlare" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#00F3FF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#00F3FF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#00F3FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldFlare" cx="80%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#39FF14" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetFlare" cx="70%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#BC13FE" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#BC13FE" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon Brand Gradients -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F3FF"/>
      <stop offset="50%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#BC13FE"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F3FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00F3FF"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1527" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F3FF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#39FF14" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#00F3FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#BC13FE" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Circuit Dot Pattern -->
    <pattern id="circ" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="#39FF14" opacity="0.12"/>
      <path d="M 0 16 L 32 16 M 16 0 L 16 32" stroke="#00F3FF" stroke-width="0.5" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#circ)"/>
  <rect width="1280" height="640" fill="url(#cyanFlare)"/>
  <rect width="1280" height="640" fill="url(#emeraldFlare)"/>
  <rect width="1280" height="640" fill="url(#violetFlare)"/>

  <!-- Framing Neon Border -->
  <rect x="24" y="24" width="1232" height="592" rx="28" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.85"/>
  <rect x="28" y="28" width="1224" height="584" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>

  <!-- Top Corner Cyber Accents -->
  <path d="M 36 60 L 36 36 L 60 36" stroke="#39FF14" stroke-width="3" fill="none"/>
  <path d="M 1244 60 L 1244 36 L 1220 36" stroke="#00F3FF" stroke-width="3" fill="none"/>
  <path d="M 36 580 L 36 604 L 60 604" stroke="#00F3FF" stroke-width="3" fill="none"/>
  <path d="M 1244 580 L 1244 604 L 1220 604" stroke="#BC13FE" stroke-width="3" fill="none"/>

  <!-- LEFT COLUMN: Brand Identity & Value Proposition -->
  <g transform="translate(80, 80)">
    <!-- Pill Badge -->
    <g>
      <rect x="0" y="0" width="340" height="36" rx="18" fill="rgba(57, 255, 20, 0.08)" stroke="#39FF14" stroke-width="1.2"/>
      <circle cx="20" cy="18" r="5" fill="#39FF14" filter="url(#softGlow)"/>
      <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#39FF14" letter-spacing="1.5">
        LORAPOK LABS // NEURAL HARVESTER
      </text>
    </g>

    <!-- Main Title "NoCatch" -->
    <g transform="translate(0, 75)">
      <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" fill="url(#brandGrad)" letter-spacing="-2" filter="url(#neonGlow)">
        NoCatch
