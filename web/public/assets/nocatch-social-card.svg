    </text>

    <!-- 4 Key Pill Features -->
    <g transform="translate(0, 290)">
      <!-- Pill 1: 128kbps AAC -->
      <g transform="translate(0, 0)">
        <rect width="155" height="34" rx="12" fill="rgba(57, 255, 20, 0.1)" stroke="rgba(57, 255, 20, 0.3)" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#39FF14"/>
        <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">128kbps AAC Audio</text>
