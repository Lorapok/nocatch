        <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">H.264 Video Track</text>
      </g>

      <!-- Pill 3: Master ZIP -->
      <g transform="translate(320, 0)">
        <rect width="150" height="34" rx="12" fill="rgba(188, 19, 254, 0.1)" stroke="rgba(188, 19, 254, 0.3)" stroke-width="1"/>
        <circle cx="16" cy="17" r="4" fill="#BC13FE"/>
        <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">1-Click Studio ZIP</text>
