    <!-- Footer URL & Badge -->
    <g transform="translate(0, 420)">
      <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="16" font-weight="700" fill="#00F3FF">
        ⚡ nocatch.lorapok.tech
