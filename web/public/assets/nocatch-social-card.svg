      <!-- Live Waveform Scrubber -->
      <g transform="translate(16, 85)">
        <rect width="390" height="6" rx="3" fill="#1e293b"/>
        <rect width="180" height="6" rx="3" fill="url(#brandGrad)"/>
        <circle cx="180" cy="3" r="5" fill="#FFFFFF" filter="url(#softGlow)"/>
      </g>
    </g>

    <!-- 4 Studio Files Mini Table -->
    <g transform="translate(24, 190)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" letter-spacing="1">
        STUDIO GENERATED ASSETS (ALL 5 DOWNLOADABLE):
      </text>

      <!-- Item 1: Audio Overview -->
      <g transform="translate(0, 14)">
        <rect width="422" height="42" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(57, 255, 20, 0.2)" stroke-width="1"/>
        <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">🎧 1. Audio Overview Podcast</text>
        <rect x="250" y="10" width="75" height="22" rx="6" fill="rgba(57, 255, 20, 0.15)"/>
        <text x="260" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="700" fill="#39FF14">.M4A / AAC</text>
        <rect x="335" y="10" width="75" height="22" rx="6" fill="#39FF14"/>
        <text x="345" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#000000">DOWNLOAD</text>
      </g>

      <!-- Item 2: Video Canvas -->
      <g transform="translate(0, 64)">
        <rect width="422" height="42" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(0, 243, 255, 0.2)" stroke-width="1"/>
        <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">🎬 2. Google Video Canvas</text>
        <rect x="250" y="10" width="75" height="22" rx="6" fill="rgba(0, 243, 255, 0.15)"/>
        <text x="260" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="700" fill="#00F3FF">.MP4 / AVC1</text>
        <rect x="335" y="10" width="75" height="22" rx="6" fill="#00F3FF"/>
        <text x="345" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#000000">DOWNLOAD</text>
      </g>

      <!-- Item 3: Briefing Doc -->
      <g transform="translate(0, 114)">
        <rect width="422" height="42" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1"/>
        <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">📄 3. Study Guide &amp; Briefing Doc</text>
        <rect x="250" y="10" width="75" height="22" rx="6" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="266" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="700" fill="#34D399">.MD NOTES</text>
        <rect x="335" y="10" width="75" height="22" rx="6" fill="#10B981"/>
        <text x="345" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#000000">DOWNLOAD</text>
