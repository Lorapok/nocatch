<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240" fill="none">
  <defs>
    <!-- Background Space Gradients -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b18"/>
      <stop offset="45%" stop-color="#030712"/>
      <stop offset="85%" stop-color="#070c1e"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <!-- Radial Core Auras -->
    <radialGradient id="leftAvatarGlow" cx="15%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#00F3FF" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#5865F2" stop-opacity="0.18"/>
      <stop offset="80%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rightCoreGlow" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#00F3FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleAccent" cx="50%" cy="100%" r="45%">
      <stop offset="0%" stop-color="#BC13FE" stop-opacity="0.20"/>
      <stop offset="70%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Linear Gradient with Discord Blurple & Lorapok Neon -->
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#00F3FF" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#39FF14" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#BC13FE" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Brand Typography Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2F9FF"/>
      <stop offset="75%" stop-color="#00F3FF"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.1" fill="#00F3FF" opacity="0.12"/>
      <path d="M 0 12 L 24 12 M 12 0 L 12 24" stroke="#5865F2" stroke-width="0.4" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="680" height="240" rx="16" fill="url(#spaceBg)"/>
  <rect width="680" height="240" rx="16" fill="url(#dotGrid)"/>

  <!-- Atmospheric Ambient Glows -->
  <rect width="680" height="240" rx="16" fill="url(#leftAvatarGlow)"/>
  <rect width="680" height="240" rx="16" fill="url(#rightCoreGlow)"/>
  <rect width="680" height="240" rx="16" fill="url(#purpleAccent)"/>

  <!-- Outer Cyber Border Frame -->
  <rect x="1" y="1" width="678" height="238" rx="15" fill="none" stroke="url(#cyberBorder)" stroke-width="1.8"/>

  <!-- Left Side: Ambient Sonic Conduit / Safe Horizon for Overlapping Avatar -->
  <g transform="translate(45, 120)" opacity="0.85">
    <!-- Concentric Acoustic Waves radiating from where avatar sits -->
    <circle cx="45" cy="50" r="110" fill="none" stroke="#5865F2" stroke-width="1.2" opacity="0.25" stroke-dasharray="6 8"/>
    <circle cx="45" cy="50" r="85" fill="none" stroke="#00F3FF" stroke-width="1.5" opacity="0.35" stroke-dasharray="4 6"/>
    <circle cx="45" cy="50" r="60" fill="none" stroke="#39FF14" stroke-width="1.8" opacity="0.45"/>
    
    <!-- Sonic Equalizer Arc Bars -->
    <path d="M -15,10 A 70,70 0 0,1 105,10" fill="none" stroke="#00F3FF" stroke-width="3" opacity="0.7" filter="url(#softGlow)"/>
    <path d="M 0,25 A 50,50 0 0,1 90,25" fill="none" stroke="#39FF14" stroke-width="2.5" opacity="0.85"/>
  </g>

  <!-- Top System Badge Bar (y: 24..42) -->
  <g transform="translate(188, 30)">
    <!-- Lorapok Labs Discord Edition Pill -->
    <rect x="0" y="0" width="186" height="22" rx="11" fill="#081022" stroke="#5865F2" stroke-width="1" opacity="0.9"/>
    <!-- Glowing Status Indicator Dot -->
    <circle cx="12" cy="11" r="3.5" fill="#39FF14" filter="url(#softGlow)"/>
    <text x="22" y="15" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="0.8">LORAPOK LABS <tspan fill="#5865F2">//</tspan> <tspan fill="#00F3FF">BOT</tspan></text>

    <!-- Slash Command Pill -->
    <g transform="translate(196, 0)">
      <rect x="0" y="0" width="124" height="22" rx="11" fill="#0c182d" stroke="#00F3FF" stroke-width="0.9" opacity="0.85"/>
      <text x="12" y="15" fill="#00F3FF" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">/nocatch audio</text>
    </g>

    <!-- Version Pill -->
    <g transform="translate(390, 0)">
      <rect x="0" y="0" width="82" height="22" rx="11" fill="#0a1a12" stroke="#39FF14" stroke-width="0.9" opacity="0.85"/>
      <text x="13" y="15" fill="#39FF14" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="0.5">v2.0.0 OK</text>
    </g>
  </g>

  <!-- Central Title Section (x: 188, y: 65..125) -->
  <g transform="translate(188, 92)">
    <!-- Glowing Brand Title -->
    <text x="0" y="0" fill="url(#titleGrad)" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.8" filter="url(#softGlow)">NoCatch</text>
    
    <!-- Mini Studio Spark Icon -->
    <g transform="translate(202, -36)">
      <circle cx="12" cy="12" r="14" fill="#00F3FF" opacity="0.12" filter="url(#softGlow)"/>
      <path d="M 12 3 L 14.5 9.5 L 21 12 L 14.5 14.5 L 12 21 L 9.5 14.5 L 3 12 L 9.5 9.5 Z" fill="#39FF14"/>
    </g>

    <!-- Subtitle Monospace Label -->
    <text x="1" y="24" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" letter-spacing="1.8">UNIVERSAL NOTEBOOKLM HARVESTER</text>
  </g>

  <!-- Right Side Spectrum Analyzer Visualizer (x: 575..655, y: 60..140) -->
  <g transform="translate(565, 65)">
    <!-- Spectrum Bars -->
    <rect x="0"  y="35" width="4" height="40" rx="2" fill="#5865F2" filter="url(#softGlow)"/>
    <rect x="8"  y="15" width="4" height="60" rx="2" fill="#00F3FF" filter="url(#softGlow)"/>
    <rect x="16" y="5"  width="4" height="70" rx="2" fill="#39FF14" filter="url(#softGlow)"/>
    <rect x="24" y="22" width="4" height="53" rx="2" fill="#00F3FF"/>
    <rect x="32" y="40" width="4" height="35" rx="2" fill="#BC13FE"/>
    <rect x="40" y="10" width="4" height="65" rx="2" fill="#39FF14" filter="url(#softGlow)"/>
    <rect x="48" y="28" width="4" height="47" rx="2" fill="#00F3FF"/>
    <rect x="56" y="8"  width="4" height="67" rx="2" fill="#5865F2"/>
    <rect x="64" y="20" width="4" height="55" rx="2" fill="#39FF14"/>
    <rect x="72" y="45" width="4" height="30" rx="2" fill="#BC13FE"/>
    <rect x="80" y="30" width="4" height="45" rx="2" fill="#00F3FF"/>
  </g>

  <!-- Bottom Feature Strip (x: 188, y: 155..205) -->
  <g transform="translate(188, 160)">
    <!-- Feature Pill 1: Audio Overviews -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="142" height="34" rx="8" fill="#0a1224" stroke="rgba(0, 243, 255, 0.4)" stroke-width="1"/>
      <circle cx="16" cy="17" r="7" fill="#00F3FF" opacity="0.2"/>
      <path d="M 13 17 A 3 3 0 0 1 19 17 M 11 17 A 5 5 0 0 1 21 17 M 16 13 L 16 21" stroke="#00F3FF" stroke-width="1.4" stroke-linecap="round"/>
      <text x="30" y="21" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700">Audio Overviews</text>
    </g>

    <!-- Feature Pill 2: Video Canvas MP4 -->
    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="138" height="34" rx="8" fill="#071817" stroke="rgba(57, 255, 20, 0.4)" stroke-width="1"/>
      <circle cx="16" cy="17" r="7" fill="#39FF14" opacity="0.2"/>
      <path d="M 13 13 L 20 17 L 13 21 Z" fill="#39FF14"/>
      <text x="30" y="21" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700">Video Canvas MP4</text>
    </g>

    <!-- Feature Pill 3: Zero-Retention -->
    <g transform="translate(296, 0)">
      <rect x="0" y="0" width="144" height="34" rx="8" fill="#130e26" stroke="rgba(188, 19, 254, 0.4)" stroke-width="1"/>
      <circle cx="16" cy="17" r="7" fill="#BC13FE" opacity="0.2"/>
      <path d="M 16 11 L 21 13 L 21 17 C 21 20 16 22 16 22 C 16 22 11 20 11 17 L 11 13 Z" fill="none" stroke="#BC13FE" stroke-width="1.3"/>
      <text x="30" y="21" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700">Zero-Retention Vault</text>
    </g>
  </g>

  <!-- Subtle Bottom Edge Ambient Wave Conduit -->
  <path d="M 0 236 Q 170 232 340 236 T 680 236" fill="none" stroke="url(#cyberBorder)" stroke-width="1.5" opacity="0.6"/>
</svg>
