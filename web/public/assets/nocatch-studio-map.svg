<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="mapBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="50%" stop-color="#040810"/>
      <stop offset="100%" stop-color="#010206"/>
    </radialGradient>

    <!-- Node Card Gradients -->
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10192e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070c18" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="coreCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2338" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#091829" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050d18" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="borderCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F3FF"/>
      <stop offset="100%" stop-color="#005577"/>
    </linearGradient>

    <linearGradient id="borderGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#0a6618"/>
    </linearGradient>

    <linearGradient id="borderPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BC13FE"/>
      <stop offset="100%" stop-color="#550877"/>
    </linearGradient>

    <!-- Pipeline Glow Lines -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot Pattern -->
    <pattern id="gridDots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#00f3ff" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="600" fill="url(#mapBg)"/>
  <rect width="1200" height="600" fill="url(#gridDots)"/>

  <!-- Outer Framing -->
  <rect x="20" y="20" width="1160" height="560" rx="16" fill="none" stroke="#00F3FF" stroke-width="1.5" opacity="0.3"/>
  <!-- Corner Tech Accents -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#39FF14" stroke-width="4"/>
  <path d="M 1180 50 L 1180 20 L 1150 20" fill="none" stroke="#00F3FF" stroke-width="4"/>
  <path d="M 20 550 L 20 580 L 50 580" fill="none" stroke="#00F3FF" stroke-width="4"/>
  <path d="M 1180 550 L 1180 580 L 1150 580" fill="none" stroke="#BC13FE" stroke-width="4"/>

  <!-- Header Title -->
  <g transform="translate(60, 56)">
    <circle cx="10" cy="12" r="5" fill="#39FF14" filter="url(#neonGreen)"/>
    <text x="26" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" font-weight="700" fill="#39FF14" letter-spacing="2">LORAPOK LABS ARCHITECTURE</text>
    <text x="26" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">NoCatch Universal Studio Harvester Pipeline</text>
  </g>

  <!-- Status Pill at Top Right -->
  <g transform="translate(940, 54)">
    <rect width="200" height="32" rx="16" fill="#04121a" stroke="#00F3FF" stroke-width="1.5"/>
    <circle cx="20" cy="16" r="4" fill="#00F3FF" filter="url(#neonCyan)"/>
    <text x="34" y="21" font-family="monospace" font-size="12" font-weight="600" fill="#00F3FF">ZERO-TRUST SECURE</text>
  </g>

  <!-- ================= PIPELINE BUS WIRES ================= -->
  <!-- Wire from Left Input to Core -->
  <path d="M 310 300 L 450 300" fill="none" stroke="#00F3FF" stroke-width="3" filter="url(#neonCyan)"/>
  <!-- Wire Pulse Dots -->
  <circle cx="360" cy="300" r="4" fill="#FFFFFF"/>
  <circle cx="410" cy="300" r="4" fill="#FFFFFF"/>

  <!-- Bus Wires from Core to 5 Outputs -->
  <!-- Output 1: Audio -->
  <path d="M 730 260 C 780 260, 800 150, 850 150" fill="none" stroke="#39FF14" stroke-width="2.5" filter="url(#neonGreen)"/>
  <circle cx="790" cy="205" r="3.5" fill="#FFFFFF"/>

  <!-- Output 2: Video -->
  <path d="M 730 280 C 780 280, 800 230, 850 230" fill="none" stroke="#00F3FF" stroke-width="2.5" filter="url(#neonCyan)"/>
  <circle cx="790" cy="255" r="3.5" fill="#FFFFFF"/>

  <!-- Output 3: Study Guide -->
  <path d="M 730 300 L 850 300" fill="none" stroke="#39FF14" stroke-width="2.5" filter="url(#neonGreen)"/>
  <circle cx="790" cy="300" r="3.5" fill="#FFFFFF"/>

  <!-- Output 4: Transcript -->
  <path d="M 730 320 C 780 320, 800 370, 850 370" fill="none" stroke="#00F3FF" stroke-width="2.5" filter="url(#neonCyan)"/>
  <circle cx="790" cy="345" r="3.5" fill="#FFFFFF"/>

  <!-- Output 5: Master ZIP -->
  <path d="M 730 340 C 780 340, 800 450, 850 450" fill="none" stroke="#BC13FE" stroke-width="3" filter="url(#neonCyan)"/>
  <circle cx="790" cy="395" r="3.5" fill="#FFFFFF"/>


  <!-- ================= COLUMN 1: GOOGLE NOTEBOOKLM SOURCE ================= -->
  <g transform="translate(60, 150)">
    <rect width="250" height="300" rx="16" fill="url(#cardDark)" stroke="url(#borderCyan)" stroke-width="2"/>
    
    <!-- Badge -->
    <rect x="20" y="20" width="100" height="24" rx="6" fill="#003344" stroke="#00F3FF" stroke-width="1"/>
    <text x="28" y="36" font-family="monospace" font-size="11" font-weight="700" fill="#00F3FF">SOURCE NODE</text>

    <!-- Node Title -->
    <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Google NotebookLM</text>
    <text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8899aa">Cloud Knowledge Workspace</text>

    <!-- Source Items -->
    <g transform="translate(20, 115)">
      <rect width="210" height="34" rx="6" fill="#060c18" stroke="#1d2d44" stroke-width="1"/>
      <text x="12" y="22" font-family="monospace" font-size="12" fill="#00F3FF">notebook.google.com</text>
    </g>

    <g transform="translate(20, 158)">
      <rect width="210" height="34" rx="6" fill="#060c18" stroke="#1d2d44" stroke-width="1"/>
      <text x="12" y="22" font-family="monospace" font-size="12" fill="#39FF14">/artifact/UUID</text>
    </g>

    <g transform="translate(20, 201)">
      <rect width="210" height="34" rx="6" fill="#060c18" stroke="#1d2d44" stroke-width="1"/>
      <text x="12" y="22" font-family="monospace" font-size="11" fill="#c4d1eb">Google batchexecute RPC</text>
    </g>

    <g transform="translate(20, 244)">
      <rect width="210" height="34" rx="6" fill="#060c18" stroke="#1d2d44" stroke-width="1"/>
      <text x="12" y="22" font-family="monospace" font-size="11" fill="#c4d1eb">Session Token / Direct Link</text>
    </g>
  </g>


  <!-- ================= COLUMN 2: NOCATCH CORE HARVESTER ENGINE ================= -->
  <g transform="translate(450, 120)">
    <rect width="280" height="360" rx="20" fill="url(#coreCard)" stroke="url(#borderGreen)" stroke-width="3" filter="url(#neonGreen)"/>

    <!-- Core Mascot Emblem -->
    <g transform="translate(100, 25) scale(0.35)">
      <ellipse cx="60" cy="80" rx="35" ry="32" fill="#00F3FF"/>
      <ellipse cx="90" cy="75" rx="38" ry="35" fill="#00e5b0"/>
      <ellipse cx="120" cy="70" rx="42" ry="38" fill="#14ff9e"/>
      <ellipse cx="160" cy="65" rx="48" ry="42" fill="#00F3FF"/>
      <rect x="135" y="48" width="56" height="32" rx="10" fill="#020813" stroke="#39FF14" stroke-width="3"/>
      <rect x="144" y="58" width="12" height="12" rx="3" fill="#39FF14"/>
      <rect x="168" y="58" width="12" height="12" rx="3" fill="#39FF14"/>
    </g>

    <!-- Node Title -->
    <text x="140" y="115" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">NoCatch Engine</text>
    <text x="140" y="135" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#39FF14">v2.0 MASTER HARVESTER</text>

    <!-- Functional Modules -->
    <g transform="translate(25, 155)">
      <!-- Module 1 -->
      <rect width="230" height="42" rx="8" fill="#030814" stroke="#00F3FF" stroke-width="1.2"/>
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1. Artifact &amp; Token Parser</text>
      <text x="14" y="34" font-family="monospace" font-size="10" fill="#00F3FF">Auto-resolves Google RPC IDs</text>

      <!-- Module 2 -->
      <g transform="translate(0, 52)">
        <rect width="230" height="42" rx="8" fill="#030814" stroke="#39FF14" stroke-width="1.2"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">2. Stream URL Extractor</text>
        <text x="14" y="34" font-family="monospace" font-size="10" fill="#39FF14">Direct Google CDN Stream</text>
      </g>

      <!-- Module 3 -->
      <g transform="translate(0, 104)">
        <rect width="230" height="42" rx="8" fill="#030814" stroke="#BC13FE" stroke-width="1.2"/>
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3. In-Browser JSZip Engine</text>
        <text x="14" y="34" font-family="monospace" font-size="10" fill="#BC13FE">Client-Side Zero-Buffer Bundle</text>
      </g>
    </g>

    <!-- Badge Bottom -->
    <rect x="25" y="318" width="230" height="26" rx="6" fill="#02140a" stroke="#39FF14" stroke-width="1"/>
    <text x="140" y="335" text-anchor="middle" font-family="monospace" font-size="11" font-weight="600" fill="#39FF14">ZERO-TRUST • NO CLOUD LOGS</text>
  </g>


  <!-- ================= COLUMN 3: HARVESTED ASSETS ================= -->
  <!-- Target 1: Audio Overview -->
  <g transform="translate(850, 120)">
    <rect width="290" height="60" rx="10" fill="url(#cardDark)" stroke="#39FF14" stroke-width="1.8"/>
    <circle cx="28" cy="30" r="14" fill="#042210" stroke="#39FF14" stroke-width="1.5"/>
    <text x="23" y="35" font-family="sans-serif" font-size="14" fill="#39FF14">🎧</text>
    <text x="54" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Audio Overview Podcast</text>
    <text x="54" y="44" font-family="monospace" font-size="11" fill="#39FF14">Original 128kbps stereo (.m4a)</text>
  </g>

  <!-- Target 2: Video Canvas -->
  <g transform="translate(850, 200)">
    <rect width="290" height="60" rx="10" fill="url(#cardDark)" stroke="#00F3FF" stroke-width="1.8"/>
    <circle cx="28" cy="30" r="14" fill="#031d24" stroke="#00F3FF" stroke-width="1.5"/>
    <text x="23" y="35" font-family="sans-serif" font-size="14" fill="#00F3FF">🎬</text>
    <text x="54" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Google Video Canvas</text>
    <text x="54" y="44" font-family="monospace" font-size="11" fill="#00F3FF">320x240 AVC1 @ 30fps (.mp4)</text>
  </g>

  <!-- Target 3: Study Guide -->
  <g transform="translate(850, 280)">
    <rect width="290" height="60" rx="10" fill="url(#cardDark)" stroke="#39FF14" stroke-width="1.8"/>
    <circle cx="28" cy="30" r="14" fill="#042210" stroke="#39FF14" stroke-width="1.5"/>
    <text x="23" y="35" font-family="sans-serif" font-size="14" fill="#39FF14">📄</text>
    <text x="54" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Study Guide &amp; Briefing Doc</text>
    <text x="54" y="44" font-family="monospace" font-size="11" fill="#39FF14">Synthesized Outline (.md)</text>
  </g>

  <!-- Target 4: Audio Transcript -->
  <g transform="translate(850, 360)">
    <rect width="290" height="60" rx="10" fill="url(#cardDark)" stroke="#00F3FF" stroke-width="1.8"/>
    <circle cx="28" cy="30" r="14" fill="#031d24" stroke="#00F3FF" stroke-width="1.5"/>
    <text x="23" y="35" font-family="sans-serif" font-size="14" fill="#00F3FF">💬</text>
    <text x="54" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Full Audio Transcript</text>
    <text x="54" y="44" font-family="monospace" font-size="11" fill="#00F3FF">Speaker Dialogue &amp; Timestamps</text>
  </g>

  <!-- Target 5: Master ZIP Archive -->
  <g transform="translate(850, 440)">
    <rect width="290" height="60" rx="10" fill="url(#cardDark)" stroke="url(#borderPurple)" stroke-width="2" filter="url(#neonCyan)"/>
    <circle cx="28" cy="30" r="14" fill="#1a0429" stroke="#BC13FE" stroke-width="1.5"/>
    <text x="23" y="35" font-family="sans-serif" font-size="14" fill="#BC13FE">📦</text>
    <text x="54" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Master Studio ZIP Bundle</text>
    <text x="54" y="44" font-family="monospace" font-size="11" fill="#BC13FE">1-Click All 5 Assets (.zip)</text>
  </g>
</svg>
