<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="iconBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="60%" stop-color="#050a14"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F3FF"/>
      <stop offset="50%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#BC13FE"/>
    </linearGradient>

    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F3FF" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#39FF14" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Larva Body Gradients -->
    <linearGradient id="bodySegment1" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00F3FF"/>
      <stop offset="100%" stop-color="#0a5c75"/>
    </linearGradient>
    <linearGradient id="bodySegment2" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00e5d4"/>
      <stop offset="100%" stop-color="#08665b"/>
    </linearGradient>
    <linearGradient id="bodySegment3" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#14ff9e"/>
      <stop offset="100%" stop-color="#0d7049"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00F3FF"/>
      <stop offset="50%" stop-color="#00e5b0"/>
      <stop offset="100%" stop-color="#047a68"/>
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00F3FF"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#iconBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="6" opacity="0.85"/>

  <!-- Subtle Cyber Ring / Pedestal -->
  <circle cx="256" cy="256" r="210" fill="url(#haloGlow)"/>
  <ellipse cx="256" cy="388" rx="180" ry="24" fill="#010408" opacity="0.9"/>
  <ellipse cx="256" cy="388" rx="170" ry="20" fill="none" stroke="#00F3FF" stroke-width="3" opacity="0.5" filter="url(#glow)"/>
  <ellipse cx="256" cy="388" rx="120" ry="12" fill="none" stroke="#39FF14" stroke-width="2" opacity="0.7"/>

  <!-- Equalizer soundbars in background -->
  <g opacity="0.85">
    <rect x="90" y="240" width="8" height="50" rx="4" fill="#00F3FF" filter="url(#glow)"/>
    <rect x="106" y="200" width="8" height="90" rx="4" fill="#39FF14" filter="url(#glow)"/>
    <rect x="122" y="170" width="8" height="120" rx="4" fill="#BC13FE" filter="url(#glow)"/>
    <rect x="138" y="220" width="8" height="70" rx="4" fill="#00F3FF"/>
  </g>

  <!-- Masoct / Cyber Larva -->
  <g transform="translate(48, 42)">
    <!-- Segment 1 (Tail) -->
    <ellipse cx="100" cy="270" rx="60" ry="56" fill="url(#bodySegment1)"/>
    
    <!-- Segment 2 (Mid) -->
    <ellipse cx="145" cy="260" rx="66" ry="62" fill="url(#bodySegment2)"/>
    
    <!-- Segment 3 (Front Body) -->
    <ellipse cx="195" cy="250" rx="72" ry="68" fill="url(#bodySegment3)"/>
    
    <!-- Luminous Cyber Belly Stripe -->
    <path d="M 90 295 C 130 320, 200 315, 270 270" fill="none" stroke="#39FF14" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Head -->
    <ellipse cx="270" cy="235" rx="80" ry="74" fill="url(#headGrad)"/>

    <!-- Antennae -->
    <!-- Left Antenna -->
    <path d="M 230 180 Q 200 135 185 120" fill="none" stroke="#00F3FF" stroke-width="6" stroke-linecap="round"/>
    <circle cx="185" cy="120" r="12" fill="#00F3FF" filter="url(#intenseGlow)"/>
    <circle cx="185" cy="120" r="6" fill="#FFFFFF"/>

    <!-- Right Antenna -->
    <path d="M 290 175 Q 320 130 335 115" fill="none" stroke="#39FF14" stroke-width="6" stroke-linecap="round"/>
    <circle cx="335" cy="115" r="12" fill="#39FF14" filter="url(#intenseGlow)"/>
    <circle cx="335" cy="115" r="6" fill="#FFFFFF"/>

    <!-- Cyber Headphone Band -->
    <path d="M 175 220 C 180 120, 340 120, 345 220" fill="none" stroke="#39FF14" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 175 220 C 180 120, 340 120, 345 220" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Left Ear Cup -->
    <rect x="162" y="200" width="22" height="52" rx="11" fill="#020813" stroke="#00F3FF" stroke-width="4" filter="url(#glow)"/>
    <line x1="173" y1="210" x2="173" y2="242" stroke="#39FF14" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Ear Cup -->
    <rect x="336" y="200" width="22" height="52" rx="11" fill="#020813" stroke="#39FF14" stroke-width="4" filter="url(#glow)"/>
    <line x1="347" y1="210" x2="347" y2="242" stroke="#00F3FF" stroke-width="3" stroke-linecap="round"/>

    <!-- Cyber Visor / Faceplate -->
    <rect x="220" y="205" width="102" height="58" rx="18" fill="#01060f" stroke="#00F3FF" stroke-width="4"/>
    
    <!-- Neon Glowing Eyes -->
    <rect x="234" y="222" width="24" height="24" rx="7" fill="#39FF14" filter="url(#intenseGlow)"/>
    <rect x="238" y="226" width="16" height="16" rx="4" fill="#FFFFFF"/>

    <rect x="282" y="222" width="24" height="24" rx="7" fill="#39FF14" filter="url(#intenseGlow)"/>
    <rect x="286" y="226" width="16" height="16" rx="4" fill="#FFFFFF"/>
  </g>

  <!-- Download Harvester Badge Indicator at bottom right -->
  <g transform="translate(320, 320)" filter="url(#glow)">
    <circle cx="56" cy="56" r="48" fill="#030914" stroke="#00F3FF" stroke-width="4"/>
    <circle cx="56" cy="56" r="42" fill="none" stroke="#39FF14" stroke-width="2" stroke-dasharray="8 4"/>
    <!-- Download Arrow -->
    <path d="M 56 34 L 56 64 M 42 52 L 56 66 L 70 52" fill="none" stroke="#00F3FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 40 76 L 72 76" fill="none" stroke="#39FF14" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
