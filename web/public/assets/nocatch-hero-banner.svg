<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none" role="img" aria-label="NoCatch by Lorapok Labs - Hero Banner">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="deepSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914"/>
      <stop offset="40%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#010204"/>
    </linearGradient>

    <radialGradient id="cyanCore" cx="25%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00F3FF" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#00F3FF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#00F3FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="greenCore" cx="75%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#39FF14" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleCore" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#BC13FE" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#BC13FE" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon Brand Gradient -->
    <linearGradient id="neonBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F3FF"/>
      <stop offset="45%" stop-color="#39FF14"/>
      <stop offset="85%" stop-color="#BC13FE"/>
      <stop offset="100%" stop-color="#00F3FF"/>
    </linearGradient>

    <linearGradient id="mascotBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="headphoneArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F3FF"/>
      <stop offset="50%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00F3FF"/>
    </linearGradient>

    <linearGradient id="glassCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="bigGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="mediumGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Circuit Pattern -->
    <pattern id="gridPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#39FF14" opacity="0.14"/>
      <path d="M 0 20 L 40 20 M 20 0 L 20 40" stroke="#00F3FF" stroke-width="0.6" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#deepSpace)"/>
  <rect width="1600" height="900" fill="url(#gridPattern)"/>
  <rect width="1600" height="900" fill="url(#cyanCore)"/>
  <rect width="1600" height="900" fill="url(#greenCore)"/>
  <rect width="1600" height="900" fill="url(#purpleCore)"/>

  <!-- Outer Cyber Frame -->
  <rect x="28" y="28" width="1544" height="844" rx="36" fill="none" stroke="url(#neonBrand)" stroke-width="2.5" opacity="0.85"/>
  <rect x="34" y="34" width="1532" height="832" rx="30" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 45 80 L 45 45 L 80 45" stroke="#39FF14" stroke-width="4" fill="none"/>
  <path d="M 1555 80 L 1555 45 L 1520 45" stroke="#00F3FF" stroke-width="4" fill="none"/>
  <path d="M 45 820 L 45 855 L 80 855" stroke="#00F3FF" stroke-width="4" fill="none"/>
  <path d="M 1555 820 L 1555 855 L 1520 855" stroke="#BC13FE" stroke-width="4" fill="none"/>

  <!-- LEFT: The Lorapok Cyber Mascot with Studio Headphones -->
  <g transform="translate(360, 450)">
    <!-- Concentric Soundwave Radiation Rings -->
    <circle cx="0" cy="0" r="260" fill="none" stroke="#00F3FF" stroke-width="1.5" stroke-dasharray="12 16" opacity="0.25"/>
    <circle cx="0" cy="0" r="210" fill="none" stroke="#39FF14" stroke-width="2" stroke-dasharray="8 12" opacity="0.4" filter="url(#mediumGlow)"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#BC13FE" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.3"/>

    <!-- Mascot Tail & Body Segments (Lorapok Cyber Larva) -->
    <ellipse cx="-130" cy="40" rx="60" ry="68" fill="url(#mascotBody)" opacity="0.85"/>
    <ellipse cx="-75" cy="20" rx="75" ry="85" fill="url(#mascotBody)" opacity="0.95"/>
    <ellipse cx="-10" cy="0" rx="90" ry="100" fill="url(#mascotBody)"/>

    <!-- Head Segment -->
    <ellipse cx="80" cy="-15" rx="105" ry="110" fill="url(#mascotBody)"/>

    <!-- Luminous Emerald Belly Bands -->
    <path d="M -130 65 Q -75 85 -10 70 Q 55 55 90 35" fill="none" stroke="#39FF14" stroke-width="8" opacity="0.75" filter="url(#bigGlow)"/>

    <!-- Cyber Goggles / Visor -->
    <rect x="40" y="-60" width="125" height="75" rx="26" fill="#030712" stroke="#00F3FF" stroke-width="5" filter="url(#bigGlow)"/>
    
    <!-- Cyber Glowing Eyes -->
    <circle cx="75" cy="-22" r="16" fill="#39FF14" filter="url(#bigGlow)"/>
    <circle cx="130" cy="-22" r="16" fill="#39FF14" filter="url(#bigGlow)"/>
    <circle cx="80" cy="-27" r="5" fill="#FFFFFF"/>
    <circle cx="135" cy="-27" r="5" fill="#FFFFFF"/>

    <!-- Cybernetic Antennae -->
    <path d="M 50 -115 Q 30 -150 15 -170" fill="none" stroke="#00F3FF" stroke-width="6" stroke-linecap="round"/>
    <circle cx="15" cy="-170" r="11" fill="#00F3FF" filter="url(#bigGlow)"/>
    <circle cx="15" cy="-170" r="4" fill="#FFFFFF"/>

    <path d="M 105 -118 Q 125 -152 145 -168" fill="none" stroke="#39FF14" stroke-width="6" stroke-linecap="round"/>
    <circle cx="145" cy="-168" r="11" fill="#39FF14" filter="url(#bigGlow)"/>
    <circle cx="145" cy="-168" r="4" fill="#FFFFFF"/>

    <!-- STUDIO HEADPHONES (Custom Fitted to Mascot) -->
    <!-- Headphone Over-Head Band -->
    <path d="M -10 -85 Q 85 -195 185 -75" fill="none" stroke="url(#headphoneArc)" stroke-width="14" stroke-linecap="round" filter="url(#bigGlow)"/>
    <path d="M -10 -85 Q 85 -195 185 -75" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6" stroke-linecap="round"/>

    <!-- Left Ear Cup -->
    <rect x="-28" y="-95" width="36" height="70" rx="16" fill="#030712" stroke="#00F3FF" stroke-width="4" filter="url(#mediumGlow)"/>
    <circle cx="-10" cy="-60" r="8" fill="#39FF14" filter="url(#bigGlow)"/>

    <!-- Right Ear Cup -->
    <rect x="168" y="-90" width="38" height="75" rx="16" fill="#030712" stroke="#39FF14" stroke-width="4" filter="url(#bigGlow)"/>
    <circle cx="187" cy="-52" r="9" fill="#00F3FF" filter="url(#bigGlow)"/>

    <!-- Holographic Floating Equalizer Bars (Live Beats) -->
    <g transform="translate(-160, -180)">
      <rect x="0" y="40" width="8" height="60" rx="4" fill="#00F3FF" opacity="0.6"/>
      <rect x="15" y="20" width="8" height="100" rx="4" fill="#39FF14" filter="url(#mediumGlow)"/>
      <rect x="30" y="5" width="8" height="130" rx="4" fill="#00F3FF" filter="url(#bigGlow)"/>
      <rect x="45" y="30" width="8" height="80" rx="4" fill="#39FF14"/>
      <rect x="60" y="10" width="8" height="120" rx="4" fill="#BC13FE"/>
      <rect x="75" y="45" width="8" height="50" rx="4" fill="#00F3FF" opacity="0.7"/>
    </g>

    <!-- Base Pod Platform -->
    <ellipse cx="0" cy="140" rx="180" ry="30" fill="#000000" opacity="0.8"/>
    <ellipse cx="0" cy="140" rx="150" ry="22" fill="none" stroke="url(#neonBrand)" stroke-width="3" opacity="0.8" filter="url(#bigGlow)"/>
  </g>

  <!-- RIGHT: Typography & Product Value Proposition -->
  <g transform="translate(760, 150)">
    <!-- Top Pill Ribbon -->
    <g>
      <rect x="0" y="0" width="410" height="42" rx="21" fill="rgba(57, 255, 20, 0.08)" stroke="#39FF14" stroke-width="1.5"/>
      <circle cx="24" cy="21" r="6" fill="#39FF14" filter="url(#bigGlow)"/>
      <text x="44" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#39FF14" letter-spacing="1.8">
        OFFICIAL PRODUCT OF LORAPOK LABS
      </text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 70)">
      <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="115" font-weight="900" fill="url(#neonBrand)" letter-spacing="-3" filter="url(#bigGlow)">
        NoCatch
      </text>
      <text x="490" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="18" font-weight="800" fill="#00F3FF" letter-spacing="2">
        v2.0 CORE
      </text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" letter-spacing="-1">
      Universal Google NotebookLM Harvester
    </text>

    <text x="0" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94A3B8" width="700">
      Download pristine Audio Overviews (M4A), Google Video Canvas (MP4),
    </text>
    <text x="0" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
      synthesized Markdown study guides, and 1-click Master ZIP bundles.
    </text>

    <!-- 5 Studio Assets Grid -->
    <g transform="translate(0, 370)">
      <!-- Box 1: Audio -->
      <g transform="translate(0, 0)">
        <rect width="320" height="70" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(57, 255, 20, 0.4)" stroke-width="1.5"/>
        <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">🎧 Audio Overview Podcast</text>
        <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="500" fill="#39FF14">Original 128kbps stereo AAC (.m4a)</text>
      </g>

      <!-- Box 2: Video -->
      <g transform="translate(340, 0)">
        <rect width="320" height="70" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 243, 255, 0.4)" stroke-width="1.5"/>
        <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">🎬 Google Video Canvas</text>
        <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="500" fill="#00F3FF">320x240 H.264 AVC1 @ 30fps (.mp4)</text>
      </g>

      <!-- Box 3: Study Notes -->
      <g transform="translate(0, 85)">
        <rect width="320" height="70" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
        <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">📄 Study Guide &amp; Briefing Doc</text>
        <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="500" fill="#34D399">Synthesized knowledge outline (.md)</text>
      </g>

      <!-- Box 4: Master Bundle -->
      <g transform="translate(340, 85)">
        <rect width="320" height="70" rx="16" fill="rgba(188, 19, 254, 0.12)" stroke="#BC13FE" stroke-width="1.5" filter="url(#mediumGlow)"/>
        <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">📦 Master Studio ZIP Archive</text>
        <text x="20" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="700" fill="#BC13FE">In-Browser JSZip Engine (All 5 Files)</text>
      </g>
    </g>

    <!-- Bottom URL Callout Bar -->
    <g transform="translate(0, 560)">
      <rect width="660" height="60" rx="18" fill="rgba(0, 0, 0, 0.7)" stroke="#39FF14" stroke-width="1.5" filter="url(#bigGlow)"/>
      <circle cx="30" cy="30" r="7" fill="#39FF14"/>
      <text x="50" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="18" font-weight="800" fill="#00F3FF">
        https://nocatch.lorapok.tech
      </text>
      <text x="380" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94A3B8">
        • Direct Google CDN • 100% Free
      </text>
    </g>
  </g>
</svg>
