<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="NoCatch by Lorapok Labs">
  <defs>
    <!-- Brand Neon Gradients -->
    <linearGradient id="nocatchNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F3FF"/>
      <stop offset="50%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#BC13FE"/>
    </linearGradient>

    <linearGradient id="waveGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F3FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00F3FF"/>
    </linearGradient>

    <linearGradient id="cyberMetal" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#00F3FF" stop-opacity="0.15"/>
      <stop offset="85%" stop-color="#BC13FE" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="256" cy="256" r="230" fill="url(#auraGlow)"/>

  <!-- Squircle Base Tile -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#cyberMetal)" filter="url(#softShadow)"/>
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="url(#nocatchNeon)" stroke-width="4" opacity="0.9" filter="url(#neonGlow)"/>
  <rect x="42" y="42" width="428" height="428" rx="102" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15"/>

  <!-- Inner Cybernetic Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#00F3FF" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Soundwave Bars (Left) -->
  <rect x="136" y="226" width="12" height="60" rx="6" fill="#00F3FF" opacity="0.7"/>
  <rect x="160" y="200" width="12" height="112" rx="6" fill="url(#waveGradient)"/>
  <rect x="184" y="170" width="12" height="172" rx="6" fill="url(#waveGradient)"/>
  <rect x="208" y="210" width="12" height="92" rx="6" fill="#39FF14"/>

  <!-- Center Core Lightning / Downloader Arrow -->
  <path d="M256 140 L256 310 M216 270 L256 316 L296 270" stroke="url(#nocatchNeon)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
  <path d="M210 350 L302 350" stroke="#39FF14" stroke-width="10" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Soundwave Bars (Right) -->
  <rect x="292" y="210" width="12" height="92" rx="6" fill="#39FF14"/>
  <rect x="316" y="170" width="12" height="172" rx="6" fill="url(#waveGradient)"/>
  <rect x="340" y="200" width="12" height="112" rx="6" fill="url(#waveGradient)"/>
  <rect x="364" y="226" width="12" height="60" rx="6" fill="#BC13FE" opacity="0.8"/>

  <!-- Pulsing Status Core Dot -->
  <circle cx="256" cy="140" r="8" fill="#FFFFFF" filter="url(#neonGlow)"/>
</svg>
